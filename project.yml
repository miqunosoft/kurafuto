# Build graph for XcodeGen. Edit this file, then run `xcodegen generate`.
# Kurafuto.xcodeproj is generated and not committed.
name: Kurafuto
options:
  bundleIdPrefix: dev.miquno
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Configs/BuildConfig.xcconfig
  Release: Configs/BuildConfig.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # String Catalogs: the compiler records every localizable string for Localizable.xcstrings.
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Kurafuto:
    type: application
    platform: iOS
    sources:
      - path: Kurafuto
        excludes:
          - "**/AGENTS.md"
          - "**/CLAUDE.md"
    info:
      path: Kurafuto/Resources/Info.plist
      properties:
        CFBundleDisplayName: Kurafuto
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Matches Theme.background in the default dark mode, so launch does not flash white.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: "Kurafuto connects to your self-hosted server panel on your local network."
        NSFaceIDUsageDescription: "Unlock Kurafuto with Face ID before controlling your servers."
        ITSAppUsesNonExemptEncryption: false
        # Widgets open a server with kurafuto://server/<id>.
        CFBundleURLTypes:
          - CFBundleURLName: dev.miquno.kurafuto
            CFBundleURLSchemes: [kurafuto]
        # Start-up and backup progress on the Lock Screen and in the Dynamic Island (ADR 0011).
        NSSupportsLiveActivities: true
    entitlements:
      path: Kurafuto/Resources/Kurafuto.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.miquno.kurafuto]
    dependencies:
      - target: KurafutoWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.miquno.kurafuto
  KurafutoWidgets:
    type: app-extension
    platform: iOS
    # Reads only the widget snapshot the app writes (ADR 0009) and draws the app's Live Activities (ADR 0011);
    # these app files are shared with it.
    sources:
      - path: KurafutoWidgets
        excludes:
          - "**/AGENTS.md"
          - "**/CLAUDE.md"
      - Kurafuto/Core/Storage/WidgetSnapshot.swift
      - Kurafuto/Core/Models/ServerStats.swift
      - Kurafuto/Core/Models/ServerActivity.swift
      - Kurafuto/DesignSystem/Palette.swift
      - Kurafuto/Resources/Localizable.xcstrings
    info:
      path: KurafutoWidgets/Info.plist
      properties:
        CFBundleDisplayName: Kurafuto
        # Must match the app's version for App Store validation.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: KurafutoWidgets/KurafutoWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.miquno.kurafuto]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.miquno.kurafuto.widgets
  KurafutoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KurafutoTests
        excludes:
          - "**/AGENTS.md"
          - "**/CLAUDE.md"
    dependencies:
      - target: Kurafuto
schemes:
  Kurafuto:
    build:
      targets:
        Kurafuto: all
    run:
      # Starts the app on MockCraftyService. Remove to test against a real panel.
      commandLineArguments:
        "-mock": true
    test:
      targets: [KurafutoTests]
      # Tests expect English text and number formats whatever the simulator's language is;
      # LocalizationTests load the other languages explicitly.
      commandLineArguments:
        "-AppleLanguages (en)": true
        "-AppleLocale en_US": true
